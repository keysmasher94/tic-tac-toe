<!doctype html>
<html lang="en-au">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <!-- add icon -->
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Tic-Tac-Toe</title>
  </head>
  <body>
    <h1>Tic-Tac-Toe</h1>
    <div class="display"></div>
    <div class="container">
      <div id="top-left"></div>
      <div id="top"></div>
      <div id="top-right"></div>
      <div id="mid-left"></div>
      <div id="mid"></div>
      <div id="mid-right"></div>
      <div id="bot-left"></div>
      <div id="bot"></div>
      <div id="bot-right"></div>
    </div>
    <form name="names">
      <label for="player-one">Enter player one's name</label>
      <input type="text" id="player-one" />
      <label for="player-two">Enter player two's name</label>
      <input type="text" id="player-two" />
      <button type="submit" id="player-names">Submit</button>
    </form>
    <button class="start">Start</button>
  </body>
</html>
